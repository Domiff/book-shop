[project]
name = "book-shop-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.5,<6",
    "django-environ>=0.12.0,<1.0.0",
    "django-stubs>=6.0.5",
    "djangorestframework>=3.16.1",
    "djangorestframework-stubs>=3.17.0",
    "faker>=40.19.1",
    "gunicorn>=26.0.0",
    "pillow>=11.3.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.15",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["backend"]
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["ALL"]
"backend/core/settings/*" = ["E501"]
"backend/core/settings/__init__.py" = ["F403"]
"backend/manage.py" = ["E402"]
